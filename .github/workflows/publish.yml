name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push the v<version> tag
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run typecheck

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Compare version with npm
        id: version
        run: |
          local_version=$(node -p "require('./package.json').version")
          if published=$(npm view stk-pr version 2>/dev/null); then :; else published=0.0.0; fi
          newest=$(printf '%s\n%s\n' "$local_version" "$published" | sort -V | tail -n 1)
          echo "version=$local_version" >> "$GITHUB_OUTPUT"
          if [ "$local_version" != "$published" ] && [ "$newest" = "$local_version" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::stk-pr $local_version is not newer than npm's $published; skipping publish."
          fi

      - name: Publish to npm
        if: steps.version.outputs.publish == 'true'
        run: |
          # Trusted publishing needs npm >= 11.5.1.
          npm install -g npm@^11.5.1
          npm publish --provenance --access public

      - name: Tag release
        if: steps.version.outputs.publish == 'true'
        run: |
          tag="v${{ steps.version.outputs.version }}"
          git tag "$tag"
          git push origin "$tag"
